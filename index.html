<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسميع القرآن - تصحيح فوري</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0fdf4; }
        .feedback { font-size: 24px; margin-top: 20px; min-height: 50px; border: 2px solid #ccc; padding: 15px; border-radius: 10px; }
        .word { margin: 5px; padding: 5px; border-radius: 5px; }
        .correct { background: #86efac; }
        .wrong { background: #fca5a5; }
        .status { color: #064e3b; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="status" id="msg">اضغط "ابدأ" للسماح بالميكروفون والبدء</div>
    <button onclick="startListening()" style="padding: 15px; font-size: 18px;">ابدأ الاختبار الآن</button>
    <div class="feedback" id="display">سأعرض كلماتك هنا فور نطقها...</div>

    <script>
        const display = document.getElementById('display');
        const msg = document.getElementById('msg');
        
        // الكلمات المطلوبة في الآية الأولى من الفاتحة كمثال
        const targetWords = ["بِسْمِ", "اللَّهِ", "الرَّحْمَٰنِ", "الرَّحِيمِ"];
        let userWords = [];

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("متصفحك لا يدعم التعرف الصوتي، يرجى استخدام متصفح Google Chrome");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = true; // استمرار الاستماع
            recognition.interimResults = true; // إظهار النتائج لحظياً

            recognition.onstart = () => {
                msg.innerHTML = "🔴 الميكروفون يعمل الآن... ابدأ بالقراءة";
                display.innerHTML = "";
            };

            recognition.onresult = (event) => {
                let currentTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentTranscript += event.results[i][0].transcript;
                }
                
                // تحويل النص لكلمات
                const spokenWords = currentTranscript.trim().split(/\s+/);
                display.innerHTML = "";
                
                spokenWords.forEach((word, index) => {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.innerText = word + " ";
                    
                    // مقارنة بسيطة (كلمة بكلمة)
                    if (targetWords[index] && word.includes(targetWords[index].replace(/[^\w\s]/g, ''))) {
                        span.classList.add('correct');
                    } else {
                        span.classList.add('wrong');
                    }
                    display.appendChild(span);
                });
            };

            recognition.onerror = (e) => {
                msg.innerHTML = "حدث خطأ: " + e.error + ". حاول الضغط مرة أخرى.";
            };

            recognition.start();
        }
    </script>
</body>
</html>
