<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُسمّع القرآن الذكي - اختبار الحفظ</title>
    <style>
        :root {
            --primary-color: #047857;
            --primary-light: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --error-color: #ef4444;
            --success-color: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.6rem;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media(min-width: 500px) {
            .settings-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #475569;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            box-sizing: border-box;
        }

        select:focus {
            border-color: var(--primary-light);
            outline: none;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-color);
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .controls {
            margin-bottom: 20px;
        }

        #actionBtn {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            font-size: 1.1rem;
        }

        #actionBtn:hover {
            background-color: #065f46;
        }

        #actionBtn.recording {
            background-color: var(--error-color);
            animation: pulse 1.2s infinite;
        }

        .status {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            color: #64748b;
        }

        .section-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none; /* مخفية افتراضياً أثناء التسميع */
        }

        .section-title {
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .target-text {
            font-size: 1.25rem;
            line-height: 2;
            text-align: center;
            font-family: 'Amiri', serif, Arial;
            color: #0f172a;
        }

        .result-box {
            font-size: 1.2rem;
            line-height: 1.8;
            text-align: right;
        }

        .word {
            display: inline-block;
            margin: 0 2px;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .correct {
            background-color: #dcfce7;
            color: #166534;
            font-weight: bold;
        }

        .incorrect {
            background-color: #fee2e2;
            color: #991b1b;
            text-decoration: underline wavy var(--error-color);
            font-weight: bold;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مُسمّع القرآن الذكي (اختبار الحفظ)</h1>
        
        <div class="settings-grid" id="settingsContainer">
            <div>
                <label for="surahSelect">اختر السورة:</label>
                <select id="surahSelect" onchange="onSurahChange()"></select>
            </div>
            <div>
                <label for="fromAyah">من الآية:</label>
                <select id="fromAyah"></select>
            </div>
            <div>
                <label for="toAyah">إلى الآية:</label>
                <select id="toAyah"></select>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <label class="checkbox-container">
                    <input type="checkbox" id="fullSurahCheck" onchange="toggleFullSurah()"> سورة بأكملها
                </label>
            </div>
        </div>

        <div class="controls">
            <button id="actionBtn" onclick="toggleSession()">ابدأ التسميع (أعنّ ظهر قلب)</button>
        </div>

        <div class="status" id="statusText">اختر السورة والآيات، ثم اضغط ابدأ واقرأ بدون النظر للآيات</div>

        <!-- صندوق الآيات المستهدفة (يظهر فقط بعد الإنهاء) -->
        <div class="section-box" id="targetSection">
            <div class="section-title">النص القرآني الصحيح للنطاق المحدد:</div>
            <div class="target-text" id="targetAyahText"></div>
        </div>

        <!-- صندوق النتيجة والمقارنة (يظهر فقط بعد الإنهاء) -->
        <div class="section-box" id="resultSection">
            <div class="section-title">مقارنة ما نطقت به وتحديد الأخطاء:</div>
            <div class="result-box" id="resultBox"></div>
        </div>
    </div>

    <script>
        let allSurahsData = [];
        let currentAyahsList = [];
        let recognition = null;
        let isRecording = false;
        let finalSpokenTranscript = '';

        const surahSelect = document.getElementById('surahSelect');
        const fromAyahSelect = document.getElementById('fromAyah');
        const toAyahSelect = document.getElementById('toAyah');
        const fullSurahCheck = document.getElementById('fullSurahCheck');
        const actionBtn = document.getElementById('actionBtn');
        const statusText = document.getElementById('statusText');
        const targetSection = document.getElementById('targetSection');
        const targetAyahText = document.getElementById('targetAyahText');
        const resultSection = document.getElementById('resultSection');
        const resultBox = document.getElementById('resultBox');
        const settingsContainer = document.getElementById('settingsContainer');

        // جلب سور القرآن كاملة من API موثوق عند التحميل
        async function fetchQuranData() {
            statusText.textContent = 'جاري تحميل فهرس سور القرآن الكريم...';
            try {
                let response = await fetch('https://api.alquran.cloud/v1/surah');
                let data = await response.json();
                allSurahsData = data.data;
                
                surahSelect.innerHTML = '';
                allSurahsData.forEach((surah, index) => {
                    let option = document.createElement('option');
                    option.value = index + 1;
                    option.textContent = `${surah.number}. ${surah.name} (${surah.numberOfAyahs} آية)`;
                    surahSelect.appendChild(option);
                });
                onSurahChange();
                statusText.textContent = 'جاهز للتسميع. اختر الآيات وابدأ';
            } catch (error) {
                statusText.textContent = 'فشل الاتصال بالإنترنت لجلب بيانات المصحف. تأكد من اتصالك.';
            }
        }

        async function onSurahChange() {
            let surahNum = surahSelect.value;
            statusText.textContent = 'جاري جلب آيات السورة...';
            try {
                let response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
                let data = await response.json();
                currentAyahsList = data.data.ayahs;
                
                populateAyahDropdowns();
                statusText.textContent = 'جاهز للتسميع.';
            } catch (e) {
                statusText.textContent = 'خطأ في جلب الآيات.';
            }
        }

        function populateAyahDropdowns() {
            fromAyahSelect.innerHTML = '';
            toAyahSelect.innerHTML = '';
            
            currentAyahsList.forEach((ayah, index) => {
                let opt1 = document.createElement('option');
                opt1.value = index;
                opt1.textContent = `الآية ${ayah.numberInSurah}`;
                fromAyahSelect.appendChild(opt1);

                let opt2 = document.createElement('option');
                opt2.value = index;
                opt2.textContent = `الآية ${ayah.numberInSurah}`;
                toAyahSelect.appendChild(opt2);
            });
            toAyahSelect.value = currentAyahsList.length - 1;
        }

        function toggleFullSurah() {
            if (fullSurahCheck.checked) {
                fromAyahSelect.value = 0;
                toAyahSelect.value = currentAyahsList.length - 1;
                fromAyahSelect.disabled = true;
                toAyahSelect.disabled = true;
            } else {
                fromAyahSelect.disabled = false;
                toAyahSelect.disabled = false;
            }
        }

        // تهيئة محرك التعرف على الصوت
        if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                finalSpokenTranscript = '';
                actionBtn.textContent = 'إيقاف التسميع وعرض النتيجة';
                actionBtn.classList.add('recording');
                statusText.textContent = '🎙️ جاري الاستماع لتلاوتك... اقرأ بتركيز (الآيات مخفية للاختبار)';
                
                // إخفاء الآيات ونتائج الاختبار أثناء التسميع تماماً
                targetSection.style.display = 'none';
                resultSection.style.display = 'none';
                settingsContainer.style.opacity = '0.5';
                surahSelect.disabled = true;
                fromAyahSelect.disabled = true;
                toAyahSelect.disabled = true;
                fullSurahCheck.disabled = true;
            };

            recognition.onresult = (event) => {
                let interim = '';
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript + ' ';
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                if (final) {
                    finalSpokenTranscript += final;
                }
            };

            recognition.onerror = (event) => {
                statusText.textContent = 'خطأ في التقاط الصوت: ' + event.error;
            };

            recognition.onend = () => {
                if (isRecording) {
                    // إذا توقف مؤقتاً نعيد تشغيله للبقاء متصلاً
                    try { recognition.start(); } catch(e){}
                }
            };
        } else {
            alert('متصفحك لا يدعم خاصية التعرف الصوتي. يرجى استخدام متصفح Google Chrome.');
        }

        function toggleSession() {
            if (isRecording) {
                // إيقاف التسميع وعرض النتائج
                isRecording = false;
                try { recognition.stop(); } catch(e){}
                processAndShowResults();
                resetUIState();
            } else {
                if (currentAyahsList.length === 0) {
                    alert('يرجى الانتظار حتى يتم تحميل الآيات.');
                    return;
                }
                // بدء التسجيل
                try {
                    recognition.start();
                } catch(e) {
                    recognition.stop();
                    recognition.start();
                }
            }
        }

        function resetUIState() {
            actionBtn.textContent = 'ابدأ التسميع (عن ظهر قلب)';
            actionBtn.classList.remove('recording');
            settingsContainer.style.opacity = '1';
            surahSelect.disabled = false;
            if (!fullSurahCheck.checked) {
                fromAyahSelect.disabled = false;
                toAyahSelect.disabled = false;
            }
            fullSurahCheck.disabled = false;
            statusText.textContent = 'تم الانتهاء من التسميع ومراجعة الأخطاء.';
        }

        // تجميع النص المستهدف والمقارنة وإظهار النتائج بعد الانتهاء
        function processAndShowResults() {
            let startIndex = parseInt(fromAyahSelect.value);
            let endIndex = parseInt(toAyahSelect.value);

            if (startIndex > endIndex) {
                alert('خطأ: آية البداية يجب أن تكون قبل آية النهاية.');
                return;
            }

            // جمع النصوص المطلوبة للآيات المحددة
            let targetTextCombined = '';
            for (let i = startIndex; i <= endIndex; i++) {
                targetTextCombined += currentAyahsList[i].text + ' ';
            }
            targetTextCombined = targetTextCombined.trim();

            // إظهار صندوق النص الصحيح وصندوق النتيجة بعد الانتهاء
            targetAyahText.textContent = targetTextCombined;
            targetSection.style.display = 'block';
            resultSection.style.display = 'block';

            // إجراء المقارنة اللحظية للأخطاء
            compareAndDisplay(targetTextCombined, finalSpokenTranscript);
        }

        function cleanText(text) {
            return text.replace(/[ًٌٍَُِّْـ]/g, "")
                       .replace(/[^\w\sأإآٱةؤئىأإآ]/gi, "")
                       .trim()
                       .split(/\s+/);
        }

        function compareAndDisplay(target, spoken) {
            const targetWords = cleanText(target);
            const spokenWords = cleanText(spoken);
            
            let htmlOutput = '';
            
            targetWords.forEach((word, index) => {
                if (index < spokenWords.length) {
                    if (spokenWords[index] === word) {
                        htmlOutput += `<span class="word correct">${word}</span> `;
                    } else {
                        htmlOutput += `<span class="word incorrect" title="نطقت: ${spokenWords[index]}">${word}</span> `;
                    }
                } else {
                    // الكلمات التي نسيتها أو لم تنطقها
                    htmlOutput += `<span class="word" style="color: #ef4444; text-decoration: line-through;">${word}</span> `;
                }
            });

            if (spokenWords.length === 0) {
                resultBox.innerHTML = '<span style="color: #ef4444;">لم يتم التقاط أي صوت بوضوح. تأكد من الميكروفون.</span>';
            } else {
                resultBox.innerHTML = htmlOutput;
            }
        }

        window.onload = fetchQuranData;
    </script>
</body>
</html>
