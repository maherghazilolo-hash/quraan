<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحن نفسك (استجابة فورية سريعة)</title>
    <style>
        :root {
            --primary-color: #047857;
            --primary-light: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --error-color: #ef4444;
            --success-color: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .settings-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .full-width {
            grid-column: span 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #475569;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            box-sizing: border-box;
        }

        .exam-box {
            background: #fffbeb;
            border: 2px dashed #f59e0b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .exam-badge {
            background: #d97706;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hidden-prompt {
            font-size: 1.1rem;
            color: #92400e;
            font-weight: bold;
        }

        /* صندوق ظهور الكلمات الفوري */
        .feedback-box {
            background: #f1f5f9;
            padding: 18px;
            border-radius: 8px;
            font-size: 1.3rem;
            text-align: center;
            line-height: 2.2;
            font-family: 'Amiri', serif;
            min-height: 80px;
        }

        .word-ok { 
            color: var(--success-color); 
            background: #dcfce7; 
            padding: 2px 6px; 
            border-radius: 4px; 
            margin: 0 2px;
            font-weight: bold; 
        }

        .word-err { 
            color: var(--error-color); 
            background: #fee2e2; 
            padding: 2px 6px; 
            border-radius: 4px; 
            margin: 0 2px;
            font-weight: bold; 
            text-decoration: underline wavy var(--error-color); 
        }

        .controls {
            margin-bottom: 15px;
        }

        #startBtn {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 1.1rem;
        }

        #startBtn.recording {
            background-color: var(--error-color);
            animation: pulse 1.2s infinite;
        }

        .status {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .helper-row {
            text-align: center;
            margin-top: 10px;
        }
        #revealBtn {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: #64748b;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            width: auto;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>امتحن نفسك (استجابة فورية سريعة جداً)</h1>
        
        <div class="settings-box" id="settingsBox">
            <div>
                <label for="surahSelect">اختر السورة:</label>
                <select id="surahSelect" onchange="updateAyahOptions()"></select>
            </div>
            <div>
                <label for="fromAyah">من الآية:</label>
                <select id="fromAyah" onchange="validateRange()"></select>
            </div>
            <div class="full-width">
                <div>
                    <label for="toAyah">إلى الآية:</label>
                    <select id="toAyah" onchange="validateRange()"></select>
                </div>
                <div>
                    <label style="visibility: hidden;">بدء</label>
                    <div style="font-size: 0.80rem; color: #047857; padding-top: 10px; font-weight: bold;">تظهر الكلمات فور نطقها</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" onclick="toggleSession()">ابدأ اختبار الحفظ الآن</button>
        </div>

        <div class="status" id="statusText">جاهز. اضغط ابدأ وابدأ بالقراءة بوضوح.</div>

        <div class="exam-box" id="examBox" style="display: none;">
            <div class="exam-badge" id="examBadge">سؤال الآية رقم: 1</div>
            <div class="hidden-prompt" id="hiddenPrompt">🎙️ استمع إليك الآن... اقرأ الكلمات فوراً</div>
        </div>

        <div class="feedback-box" id="feedbackBox">
            <span style="color: #94a3b8; font-size: 0.95rem;">الكلمات ستظهر هنا باللون الأخضر أو الأحمر فور خروجها من فمك...</span>
        </div>

        <div class="helper-row" id="helperRow" style="display: none;">
            <button id="revealBtn" onclick="revealAyahText()">إظهار النص (للمساعدة عند النسيان)</button>
        </div>
    </div>

    <script>
        const localQuranData = {
            "الفاتحة": [
                "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
                "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
                "الرَّحْمَٰنِ الرَّحِيمِ",
                "مَالِكِ يَوْمِ الدِّينِ",
                "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
                "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
                "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"
            ],
            "الإخلاص": [
                "قُلْ هُوَ اللَّهُ أَحَدٌ",
                "اللَّهُ الصَّمَدُ",
                "لَمْ يَلِدْ وَلَمْ يُولَدْ",
                "وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ"
            ],
            "الناس": [
                "قُلْ أَعُوذُ بِرَبِّ النَّاسِ",
                "مَلِكِ النَّاسِ",
                "إِلَهِ النَّاسِ",
                "مِنْ شَرِّ الْوَسْواسِ الْخَنَّاسِ",
                "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ",
                "مِنَ الْجِنَّةِ وَالنَّاسِ"
            ],
            "الفلق": [
                "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",
                "مِنْ شَرِّ مَا خَلَقَ",
                "وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ",
                "وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ",
                "وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ"
            ]
        };

        let currentSurahName = "";
        let currentAyahs = [];
        let startIndex = 0, endIndex = 0, currentIndex = 0;
        let recognition = null;
        let isSessionActive = false;
        let targetCleanWords = [];
        let targetOriginalWords = [];

        const surahSelect = document.getElementById('surahSelect');
        const fromAyah = document.getElementById('fromAyah');
        const toAyah = document.getElementById('toAyah');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const examBox = document.getElementById('examBox');
        const examBadge = document.getElementById('examBadge');
        const hiddenPrompt = document.getElementById('hiddenPrompt');
        const feedbackBox = document.getElementById('feedbackBox');
        const settingsBox = document.getElementById('settingsBox');
        const helperRow = document.getElementById('helperRow');

        function initApp() {
            surahSelect.innerHTML = '';
            for (let surahName in localQuranData) {
                let opt = document.createElement('option');
                opt.value = surahName;
                opt.textContent = surahName;
                surahSelect.appendChild(opt);
            }
            updateAyahOptions();
        }

        function updateAyahOptions() {
            currentSurahName = surahSelect.value;
            currentAyahs = localQuranData[currentSurahName];
            fromAyah.innerHTML = '';
            toAyah.innerHTML = '';
            currentAyahs.forEach((_, idx) => {
                let opt1 = document.createElement('option');
                opt1.value = idx; opt1.textContent = `الآية ${idx + 1}`;
                fromAyah.appendChild(opt1);
                let opt2 = document.createElement('option');
                opt2.value = idx; opt2.textContent = `الآية ${idx + 1}`;
                toAyah.appendChild(opt2);
            });
            toAyah.value = currentAyahs.length - 1;
            validateRange();
        }

        function validateRange() {
            if (parseInt(fromAyah.value) > parseInt(toAyah.value)) {
                toAyah.value = fromAyah.value;
            }
        }

        // إعداد التعرف الصوتي بأقصى سرعة استجابة لحظية
        if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = true;
            recognition.interimResults = true; // مفتاح السرعة: تظهر الكلمات وهي تطير من فمك فوراً

            recognition.onresult = (event) => {
                let liveTranscript = '';
                // دمج النتائج المؤقتة فوراً لعدم حدوث أي تأخير
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    liveTranscript += event.results[i][0].transcript + ' ';
                }
                processFastSpeech(liveTranscript);
            };

            recognition.onerror = (event) => {
                // تجاهل أخطاء التوقف المؤقت البسيطة للميكروفون لاستمرار العمل بسلاسة
                if(event.error !== 'no-speech') {
                    statusText.textContent = 'تنبيه: ' + event.error;
                }
            };

            recognition.onend = () => {
                if (isSessionActive) {
                    try { recognition.start(); } catch(e){}
                }
            };
        } else {
            alert('متصفحك لا يدعم التعرف الصوتي السريع. استخدم Google Chrome.');
        }

        function toggleSession() {
            if (isSessionActive) {
                stopSession();
            } else {
                startSession();
            }
        }

        function startSession() {
            isSessionActive = true;
            startIndex = parseInt(fromAyah.value);
            endIndex = parseInt(toAyah.value);
            currentIndex = startIndex;
            
            startBtn.textContent = 'إيقاف الاختبار';
            startBtn.classList.add('recording');
            settingsBox.style.opacity = '0.3';
            surahSelect.disabled = true;
            fromAyah.disabled = true;
            toAyah.disabled = true;
            examBox.style.display = 'flex';
            helperRow.style.display = 'block';

            loadAyahTest(currentIndex);
            try { recognition.start(); } catch(e){}
        }

        function stopSession() {
            isSessionActive = false;
            try { recognition.stop(); } catch(e){}
            startBtn.textContent = 'ابدأ اختبار الحفظ الآن';
            startBtn.classList.remove('recording');
            settingsBox.style.opacity = '1';
            surahSelect.disabled = false;
            fromAyah.disabled = false;
            toAyah.disabled = false;
            statusText.textContent = 'تم إيقاف الاختبار.';
            helperRow.style.display = 'none';
        }

        function loadAyahTest(index) {
            if (index > endIndex) {
                statusText.textContent = '🎉 مبروك! لقد أنهيت اختبار التسميع بنجاح تام.';
                examBox.style.display = 'none';
                stopSession();
                return;
            }
            currentIndex = index;
            let fullAyahText = currentAyahs[currentIndex];
            
            examBadge.textContent = `اختبار سورة ${currentSurahName} - الآية رقم ${currentIndex + 1}`;
            hiddenPrompt.textContent = "🎙️ جاهز... اقرأ الكلمات وسترى تلوينها فوراً";
            
            targetCleanWords = cleanText(fullAyahText);
            targetOriginalWords = fullAyahText.split(/\s+/);
            
            feedbackBox.innerHTML = '<span style="color: #64748b;">ابدأ القراءة الآن...</span>';
            statusText.textContent = '🎙️ جاري الاستماع الفوري...';
        }

        function cleanText(text) {
            return text.replace(/[ًٌٍَُِّْـ]/g, "")
                       .replace(/[^\w\sأإآٱةؤئىأإآ]/gi, "")
                       .trim()
                       .split(/\s+/)
                       .filter(w => w.length > 0);
        }

        // المعالجة الفورية السريعة للكلمات المنطوقة
        function processFastSpeech(spokenText) {
            if (!isSessionActive) return;
            
            let spokenWords = cleanText(spokenText);
            let htmlOut = '';
            let matchedCount = 0;
            let hasError = false;

            for (let i = 0; i < spokenWords.length && i < targetCleanWords.length; i++) {
                if (spokenWords[i] === targetCleanWords[i]) {
                    htmlOut += `<span class="word-ok">${targetOriginalWords[i]}</span> `;
                    matchedCount++;
                } else {
                    htmlOut += `<span class="word-err">${targetOriginalWords[i]} (خطأ)</span> `;
                    hasError = true;
                }
            }

            if (htmlOut !== '') {
                feedbackBox.innerHTML = htmlOut;
            }

            if (hasError) {
                statusText.textContent = '⚠️ تنبيه: تم رصد كلمة خاطئة (محددة بالأحمر).';
            }

            // الانتقال الفوري التلقائي للآية التالية عند اكتمال الآية الحالية
            if (matchedCount >= targetCleanWords.length) {
                statusText.textContent = '✅ أحسنت! تم اجتياز الآية والانتقال للآية التالية...';
                setTimeout(() => {
                    loadAyahTest(currentIndex + 1);
                }, 1200);
            }
        }

        function revealAyahText() {
            hiddenPrompt.textContent = currentAyahs[currentIndex];
            hiddenPrompt.style.color = '#047857';
        }

        window.onload = initApp;
    </script>
</body>
</html>
